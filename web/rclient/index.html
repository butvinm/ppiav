<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Защищённый ресурс · ppiav</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Защищённый <span class="accent">ресурс</span></h1>
      <p class="subtitle">Доступ контролируется сервисом объекта доступа.</p>
      <div id="status" class="status">Загрузка...</div>
      <form method="post" action="/reset" class="reset-form">
        <button type="submit" class="reset-btn">сбросить сессию</button>
      </form>
    </main>
    <!--
      RService injects `<script>window.verdict = {"sid":"...", "verdict":"..."};</script>`
      before </body> when serving this page. main.ts reads window.verdict and
      renders it into #status.
    -->
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
