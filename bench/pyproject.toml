[project]
name = "ppiav-bench"
version = "0.1.0"
description = "Post-processing for ppiav internal/bench JSON output: Markdown tables + PNG plots."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF001 = "ambiguous unicode" (e.g. Cyrillic с vs Latin c). The labels
# module is Russian by design — every Cyrillic char is intentional.
"bench/_labels_ru.py" = ["RUF001"]
"bench/_messages.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unreachable = true
disallow_any_unimported = false
# matplotlib + numpy stubs are partial; allow returning Any from those calls
# without infecting our own code with implicit Any.
disallow_any_expr = false

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
